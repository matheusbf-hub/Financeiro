<div class="modal fade" id="modalNovoCartao" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Novo Cartão
                </h5>

                <button type="button"
                        class="btn btn-dark"
                        data-bs-dismiss="modal"
                        data-bs-toggle="modal"
                        data-bs-target="#modalCartao">

                    Voltar

                </button>

            </div>

            <div class="modal-body-form-left">

                <form method="POST" action="{% url 'cartao' %}">

                    {% csrf_token %}

                    <input type="hidden"
                           id="editar_id_cartao"
                           name="editar_id">

                    <div class="mb-3">

                        <label class="form-label">
                            Código
                        </label>

                        <input type="number"
                               id="codigo_cartao"
                               name="codigo_cartao"
                               class="form-control"
                               value="{{ proximo_codigo_cartao }}"
                               readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input type="text"
                               id="nome_cartao"
                               class="form-control"
                               name="nome">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Banco
                        </label>

                        <select class="form-select"
                                id="banco_cartao"
                                name="banco">

                            <option value="Caixa">
                                Caixa
                            </option>

                            <option value="NuBank">
                                NuBank
                            </option>

                            <option value="Inter">
                                Inter
                            </option>

                            <option value="Bradesco">
                                Bradesco
                            </option>

                            <option value="Santander">
                                Santander
                            </option>

                            <option value="Itaú">
                                Itaú
                            </option>

                            <option value="Banco do Brasil">
                                Banco do Brasil
                            </option>

                            <option value="Outro">
                                Outro
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Bandeira
                        </label>

                        <select class="form-select"
                                id="bandeira_cartao"
                                name="bandeira">

                                <option value="1">Visa</option>
                                <option value="2">Mastercard</option>
                                <option value="3">Elo</option>
                                <option value="4">American Express</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Limite Consumido
                        </label>

                        <input type="text"
                               id="limite_consumo_cartao"
                               class="form-control"
                               name="limite_consumo"
                               inputmode="decimal"
                               value="0,00"
                               readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Limite Máximo
                        </label>

                        <input type="text"
                               id="limite_maximo_cartao"
                               class="form-control"
                               name="limite_maximo"
                               inputmode="decimal"
                               placeholder="0,00"
                               form="0,00"
                               value="0,00">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Saldo Disponível
                        </label>

                        <input type="text"
                               id="saldo_disponivel_cartao"
                               class="form-control"
                               name="limite_total"
                               inputmode="decimal"
                               value="0,00"
                               readonly>

                    </div>

                    <div class="text-end">

                        <button type="submit"
                                class="btn btn-dark">

                            Salvar

                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>
</div>



<script>

function parseValorCartao(valor) {
    if (!valor) {
        return 0;
    }

    let texto = String(valor).trim();

    if (texto.includes(',')) {
        texto = texto.replace(/\./g, '').replace(',', '.');
    }

    const numero = Number.parseFloat(texto);

    return Number.isNaN(numero) ? 0 : numero;
}

function formatarValorCartao(valor) {
    return valor.toFixed(2).replace('.', ',');
}

function atualizarSaldoDisponivelCartao() {
    const limiteMaximo = parseValorCartao(
        document.getElementById('limite_maximo_cartao').value
    );

    const limiteConsumo = parseValorCartao(
        document.getElementById('limite_consumo_cartao').value
    );

    document.getElementById('saldo_disponivel_cartao').value =
        formatarValorCartao(limiteMaximo - limiteConsumo);
}

document.querySelectorAll('.btn-editar-cartao').forEach(function(botao) {
    botao.addEventListener('click', function() {
        document.getElementById('editar_id_cartao').value =
            this.dataset.id;

        document.getElementById('codigo_cartao').value =
            this.dataset.id;

        document.getElementById('nome_cartao').value =
            this.dataset.nome;

        document.getElementById('banco_cartao').value =
            this.dataset.banco;

        document.getElementById('bandeira_cartao').value =
            this.dataset.bandeira;

        document.getElementById('limite_consumo_cartao').value =
            this.dataset.limiteConsumo;

        document.getElementById('limite_maximo_cartao').value =
            this.dataset.limiteMaximo;

        document.getElementById('saldo_disponivel_cartao').value =
            this.dataset.limiteTotal;
    });
});

function limparCartao() {
    document.getElementById('editar_id_cartao').value = '';

    document.getElementById('codigo_cartao').value =
        '{{ proximo_codigo_cartao }}';

    document.getElementById('nome_cartao').value = '';

    document.getElementById('banco_cartao').value = 'Caixa';

    document.getElementById('bandeira_cartao').value = '1';

    document.getElementById('limite_consumo_cartao').value = '0,00';

    document.getElementById('limite_maximo_cartao').value = '0,00';

    document.getElementById('saldo_disponivel_cartao').value = '0,00';
}

document.getElementById('limite_maximo_cartao').addEventListener(
    'input',
    atualizarSaldoDisponivelCartao
);

document.getElementById('limite_maximo_cartao')
    .addEventListener('input', function(e) {

        let valor = e.target.value.replace(/\D/g, '');

        valor = (parseInt(valor || 0, 10) / 100)
            .toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        e.target.value = valor;
    });

</script>
