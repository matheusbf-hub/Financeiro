{% load static %}

{% block body %}

<div class="login-container">

    <div class="login-box">
      
      <h3 class="auth-title">Cadastro de Usuário</h3><br>

        {% if messages %}
            {% for message in messages %}
                <p class="login-message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form id="login-form" method="POST">
            {% csrf_token %}

      <form id="register-form" style="margin-top:16px;">
          <div class="form-group">
                <label>Usuário</label>
                <input type="text" name="username" required>
                <input type="hidden" name="next" value="{{ next }}">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <div class="field">
          <label for="reg-name">Nome completo</label>
          <input id="reg-name" name="name" required>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" name="email" required>
        </div>
        <div class="field">
          <label for="reg-password">Senha</label>
          <input id="reg-password" type="password" name="password" required>
        </div>
        <div class="field">
          <label for="reg-password-confirm">Confirmar senha</label>
          <input id="reg-password-confirm" type="password" name="password_confirm" required>
        </div><br>
        <button class="login-button" type="submit ">Cadastrar</button>
      </form>
      <div id="register-state" style="margin-top:12px;"></div>
      <div class="login-link" style="margin-top:12px;">
        <a href="{% url 'login' %}">Já tem uma conta? Faça login</a>
    </article>
  </section>
  
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/login.js' %}"> </script>
<link rel="stylesheet" href="{% static 'css/style.css' %}">


{% endblock %}
