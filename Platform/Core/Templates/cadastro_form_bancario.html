<div class="modal fade" id="modalNovoBanco" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Conta Bancária
                </h5>

                <button type="button"
                        class="btn btn-dark"
                        data-bs-dismiss="modal"
                        data-bs-toggle="modal"
                        data-bs-target="#modalBancaria">

                    Voltar

                </button>

            </div>

            <div class="modal-body-form-left">

                <form method="POST" action="{% url 'conta_bancaria' %}">

                    {% csrf_token %}

                    <input type="hidden"
                           id="editar_id"
                           name="editar_id">

                    <div class="mb-3">

                        <label class="form-label">
                            Código
                        </label>

                        <input type="number"
                               id="codigo_banco"
                               class="form-control"
                               value="{{ proximo_codigo_banco }}"
                               readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input type="text"
                               id="nome_banco"
                               class="form-control"
                               name="nome"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Banco
                        </label>

                        <select class="form-select"
                                id="banco_banco"
                                name="banco">

                            <option value="Caixa">
                                Caixa
                            </option>

                            <option value="NuBank">
                                NuBank
                            </option>

                            <option value="Banco do Brasil">
                                Banco do Brasil
                            </option>

                            <option value="Bradesco">
                                Bradesco
                            </option>

                            <option value="Itaú">
                                Itaú
                            </option>

                            <option value="Santander">
                                Santander
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Agência
                        </label>

                        <input  type="text"
                                id="agencia_banco"
                                class="form-control"
                                name="agencia"   
                                pattern="\d{4}-\d{1}"
                                placeholder="1234-5"
                                minlength="6"
                                maxlength="6">                               

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Conta
                        </label>

                        <input type="text"
                               id="conta_banco"
                               class="form-control"
                               name="conta"
                               pattern="\d{5}-\d{1}"
                               placeholder="12345-6"
                               minlength="7"
                               maxlength="8">

                    </div>

                    <div class="text-end">

                        <button type="submit"
                                class="btn btn-dark">

                            Salvar

                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>
</div>

<script>

document.querySelectorAll('.btn-editar-banco').forEach(function(botao) {

    botao.addEventListener('click', function() {

        document.getElementById('editar_id').value =
            this.dataset.id;

        document.getElementById('codigo_banco').value =
            this.dataset.id;

        document.getElementById('nome_banco').value =
            this.dataset.nome;

        document.getElementById('banco_banco').value =
            this.dataset.banco;

        document.getElementById('agencia_banco').value =
            this.dataset.agencia;

        document.getElementById('conta_banco').value =
            this.dataset.conta;

    });

});

function limparBanco() {

    document.getElementById('editar_id').value = '';

    document.getElementById('codigo_banco').value =
        '{{ proximo_codigo_banco }}';

    document.getElementById('nome_banco').value = '';

    document.getElementById('banco_banco').value = 'Caixa';

    document.getElementById('agencia_banco').value = '';

    document.getElementById('conta_banco').value = '';

}

document.getElementById('codigo_banco').addEventListener('input', function() {
    let valor = this.value.replace(/\D/g, '');
    if (valor.length > 4) {
        valor = valor.slice(0, 4) + '-' + valor.slice(4, 5);
    }

    this.value = valor;

});


</script>
