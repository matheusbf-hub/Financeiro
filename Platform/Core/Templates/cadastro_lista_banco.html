<div class="modal fade" id="modalBancaria" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Contas Bancárias
                </h5>

                <button
                    type="button"
                    class="btn btn-dark"
                    data-bs-toggle="modal"
                    data-bs-target="#modalNovoBanco"
                    onclick="limparBanco()">

                    Novo
                    
                </button>
                
            </div>
            
            
            <div class="modal-body">
                
                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Agência</th>
                            <th>Banco</th>
                            <th>Conta</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    
                    <tbody>

                    {% for conta in contas %}

                    <tr>
                        <td>{{ conta.ID }}</td>
                        <td>{{ conta.nome }}</td>
                        <td>{{ conta.agencia }}</td>
                        <td>{{ conta.banco }}</td>
                        <td>{{ conta.conta }}</td>
                         <td>
                            <button 
                                type="button" 
                                class="btn btn-sm btn-outline-dark btn-editar-banco"
                                data-bs-toggle="modal" 
                                data-bs-target="#modalNovoBanco"
                                data-id="{{ conta.ID }}"
                                data-nome="{{ conta.nome }}"
                                data-banco="{{ conta.banco }}"
                                data-agencia="{{ conta.agencia }}"
                                data-conta="{{ conta.conta }}"
                                title="Editar">

                                <i class="bi bi-pencil"></i> 
                            </button>

                            <form method="POST" action="{% url 'conta_bancaria' %}" style="display:inline;">
                                {% csrf_token %}

                                <input type="hidden" name="acao" value="excluir">
                                <input type="hidden" name="delete_id" value="{{ conta.ID }}">

                            <button
                                type="submit"
                                class="btn btn-sm btn-outline-danger btn-deletar-banco"
                                title="Excluir"
                                onclick="return confirm('Tem certeza que deseja excluir esta conta bancária {{ conta.ID }}?')">

                                <i class="bi bi-trash"></i>

                            </button>
                            </form>
                        </td>
                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="6" class="text-center">
                            Nenhuma conta cadastrada
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>
                    
                </table>
                
            </div>

            </form>
        </div>
    </div>
</div>

{% include 'cadastro_form_bancario.html' %}
