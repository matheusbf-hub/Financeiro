{% extends 'base.html' %}
{% load static %}

{% block body %}

{% include 'user_base.html' %}

<form method="post" action="{% url 'resetpassword' %}">
    {% csrf_token %}
        
        <div class="conta-box ">
            <div class="minhaconta container-central">
                <h2 class="mb-4">Redefinir Senha</h2>
                </div>
                <label for="current_password" class="form-label">Senha Atual</label>
                <input type="password" class="form-control mb-3" id="current_password" name="current_password" required>
                <label for="new_password" class="form-label">Nova Senha</label>
                <input type="password" class="form-control mb-3" id="new_password" name="new_password" required>
                <label for="confirm_password" class="form-label">Confirmar Nova Senha</label>
                <input type="password" class="form-control mb-3" id="confirm_password" name="confirm_password" required>
                <button type="submit" class="btn btn-dark">Redefinir Senha</button>
                <div class="minhaconta container-left">
                </div>
            </div>
        </div>
    </form>

{% endblock %}
